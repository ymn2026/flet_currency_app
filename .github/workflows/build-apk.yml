name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip wget curl \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake \
          libffi-dev libssl-dev python3-pip python3-dev \
          python3-venv

    - name: Set up Android SDK
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" "platforms;android-33" \
          "build-tools;33.0.2" "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Install Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
        echo "$HOME/flutter/bin" >> $GITHUB_PATH
        echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV
        $HOME/flutter/bin/flutter doctor

    # ✅ FIX: Use only 'flet build apk' (debug is default)
    - name: Build APK with Flet
      run: |
        export FLUTTER_ROOT=$HOME/flutter
        export PATH=$FLUTTER_ROOT/bin:$PATH
        export FLUTTER_NON_INTERACTIVE=true
        yes y | flet build apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Flet-APK
        path: build/apk/**/*.apk
        if-no-files-found: error

    - name: Upload build log (if failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log